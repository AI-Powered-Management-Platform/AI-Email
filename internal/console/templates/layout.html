{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{{.Title}} — AI-Email</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--line:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#f43f5e;--accent2:#f59e0b;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:1.5rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141b26,#0f141c)}
header .brand{font-weight:650;letter-spacing:.2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:1rem;flex:1}
nav a{color:var(--muted);text-decoration:none;padding:.35rem .7rem;border-radius:.5rem}
nav a:hover{color:var(--text);background:#1a2331}
nav a[aria-current="page"]{color:var(--text);background:#1a2331}
main{padding:1.5rem;max-width:1100px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1.5rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem}
.card .n{font-size:1.6rem;font-weight:600}
.card .l{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:.75rem;overflow:hidden}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;background:#0f1620}
tr:last-child td{border-bottom:none}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
.dns{display:block;background:#0d131b;border:1px solid var(--line);border-radius:.5rem;padding:.5rem .6rem;margin:.25rem 0;white-space:pre-wrap;word-break:break-all}
.badge{display:inline-block;padding:.12rem .5rem;border-radius:999px;font-size:.78rem;border:1px solid}
.ok{color:var(--ok);border-color:#065f46;background:#052e26}
.warn{color:var(--warn);border-color:#78350f;background:#2a1a05}
.bad{color:var(--bad);border-color:#7f1d1d;background:#2a0d0d}
.muted{color:var(--muted)}
form.inline{display:inline}
button{font:inherit;background:#1a2331;color:var(--text);border:1px solid var(--line);border-radius:.5rem;padding:.3rem .7rem;cursor:pointer}
button:hover{background:#222d3d}
button.danger{border-color:#7f1d1d;color:#fca5a5}
.login{max-width:340px;margin:12vh auto}
input{width:100%;font:inherit;background:#0d131b;color:var(--text);border:1px solid var(--line);border-radius:.5rem;padding:.55rem .7rem;margin:.35rem 0 .8rem}
.err{color:#fca5a5;background:#2a0d0d;border:1px solid #7f1d1d;border-radius:.5rem;padding:.5rem .7rem;margin-bottom:.8rem}
.empty{color:var(--muted);padding:1.2rem;text-align:center}
</style>
</head>
<body>
{{if .Authed}}
<header>
  <span class="brand">AI-Email</span>
  <nav>
    <a href="/console" {{if eq .Nav "overview"}}aria-current="page"{{end}}>Overview</a>
    <a href="/console/domains" {{if eq .Nav "domains"}}aria-current="page"{{end}}>Domains</a>
    <a href="/console/keys" {{if eq .Nav "keys"}}aria-current="page"{{end}}>Keys</a>
    <a href="/console/messages" {{if eq .Nav "messages"}}aria-current="page"{{end}}>Messages</a>
    <a href="/console/suppressions" {{if eq .Nav "suppressions"}}aria-current="page"{{end}}>Suppressions</a>
  </nav>
  <form method="post" action="/console/logout" class="inline">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button>Sign out</button>
  </form>
</header>
{{end}}
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
