name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiemail
          POSTGRES_PASSWORD: aiemail_test
          POSTGRES_DB: aiemail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiemail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AIEMAIL_TEST_DATABASE_URL: postgres://aiemail:aiemail_test@127.0.0.1:5432/aiemail_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned like govulncheck below — a linter that silently changes
      # version is a supply-chain dependency like any other.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      # G9 — hot-path benchmarks (template render, DKIM sign, queue claim)
      # compile and run one iteration so a regression that breaks them is
      # caught here; full comparative runs happen on hot-path PRs.
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 1x ./internal/template ./internal/dkim ./internal/store

      # Runs here rather than locally: the race detector needs cgo, and the
      # development machine has no C compiler.
      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # secret scan covers full history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned, not @latest: a scanner that silently changes version is a
      # supply-chain dependency like any other.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      # The gitleaks CLI is MIT-licensed; the marketplace action wrapper needs
      # a paid licence for organization repos, so we run the binary directly,
      # pinned like every other scanner. --redact keeps any hit out of CI logs.
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner
