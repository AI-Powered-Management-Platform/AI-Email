name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiemail
          POSTGRES_PASSWORD: aiemail_test
          POSTGRES_DB: aiemail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiemail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AIEMAIL_TEST_DATABASE_URL: postgres://aiemail:aiemail_test@127.0.0.1:5432/aiemail_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      # Runs here rather than locally: the race detector needs cgo, and the
      # development machine has no C compiler.
      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
